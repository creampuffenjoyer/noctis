[project]
name = "noctis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "creampuffenjoyer", email = "creampuffenjoyer@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "requests>=2.32",
    "playwright>=1.44",
    "networkx>=3.3",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "google-generativeai>=0.7",
    "openai>=1.30",
    "anthropic>=0.28",
]

[project.scripts]
noctis = "noctis.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
